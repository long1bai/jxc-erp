server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ===== 业务路径配置（迁移服务器/换盘符只改这里，不碰代码）=====
app:
  upload-dir: I:/yawei-uploads          # 上传文件根目录（报工图片 /uploads/** 静态映射）
  backup-dir: I:/yawei-erp-java/backup  # 数据库备份目录
  mysqldump-path: C:/mysql/8.0.28/bin/mysqldump.exe  # mysqldump 可执行文件路径
  ai-config: I:/yawei-erp/ai_config.json     # AI 报价助手配置文件
  photo-config: I:/yawei-erp/photo_config.json  # 拍照识别配置文件
  legacy-web-public: I:/yawei-erp-java/web/public  # 旧版上传路径（清理历史文件用，新部署不再产生）

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yawei_erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 30MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
